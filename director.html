<!DOCTYPE html>
<html>
<head>
  <title>Director Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }

    .box {
      background: #111;
      padding: 20px;
      margin: 15px auto;
      border-radius: 10px;
      max-width: 400px;
      border: 1px solid gold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: gold;
      color: black;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .back-btn {
      background: #555;
      color: white;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <h1>DIRECTOR MODE</h1>
  <p id="status">Checking login...</p>

  <div class="box">
    <h2>Enter Your Number</h2>
    <input id="userNumber" type="text" placeholder="Enter number">
    <button onclick="runDirector()">Predict</button>

    <p id="result"></p>
  </div>

  <button class="back-btn" onclick="goBack()">Back to Dashboard</button>

  <script>
    // Check login token
    const token = localStorage.getItem("godmode_token");

    if (!token) {
      window.location.href = "login.html";
    } else {
      document.getElementById("status").innerText = "Logged in ✔";
    }

    async function runDirector() {
      const num = document.getElementById("userNumber").value.trim();
      const resultBox = document.getElementById("result");

      if (!num) {
        resultBox.innerText = "Enter a number first.";
        return;
      }

      resultBox.innerText = "Running Director Mode prediction...";

      try {
        const response = await fetch("https://godmode-backend2.onrender.com/director/3175", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ number: num })
        });

        const data = await response.json();

        if (!response.ok) {
          resultBox.innerText = data.detail || "Error running Director Mode prediction.";
          return;
        }

        resultBox.innerText = "Director Mode Prediction: " + data.prediction;

      } catch (err) {
        resultBox.innerText = "Network error.";
      }
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
