<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GODMODE++</title>

  <!-- Light Theme -->
  <link rel="stylesheet" href="style.css">

  <!-- Galaxy Theme -->
  <link rel="stylesheet" href="galaxy.css">
</head>

<!-- START IN GALAXY MODE -->
<body class="galaxy">

  <!-- HOME SCREEN -->
  <div id="home-screen" class="screen">

    <div class="top">
      <h1 class="title">GODMODE++</h1>
      <button onclick="toggleGalaxy()">Galaxy Mode</button>
    </div>

    <p class="subtitle">Choose your mode</p>

    <div class="grid">

      <div class="mode">
        <h3>Free Mode</h3>
        <button>Enter</button>
      </div>

      <div class="mode locked">
        <h3>God Mode</h3>
        <button disabled>Locked</button>
      </div>

      <div class="mode locked">
        <h3>Universe Mode</h3>
        <button disabled>Locked</button>
      </div>

      <div class="mode">
        <h3>Director Mode</h3>
        <button onclick="openDirector()">Enter Passcode</button>
      </div>

    </div>
  </div>

  <!-- DIRECTOR MODE MODAL -->
  <div id="director-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Director Mode</h2>
      <p>Enter passcode</p>

      <input id="director-pass" type="password" placeholder="Passcode">

      <button onclick="unlockDirector()">Unlock</button>
      <button class="close" onclick="closeDirector()">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
