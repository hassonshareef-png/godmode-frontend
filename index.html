<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GODMODE++</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Light theme -->
  <link rel="stylesheet" href="style.css">

  <!-- Galaxy theme -->
  <link rel="stylesheet" href="galaxy.css">
</head>

<body class="light">

  <!-- LOGIN -->
  <div id="login-screen" class="screen">
    <h1 class="title">GODMODE++</h1>
    <p class="subtitle">Log in to continue</p>

    <div class="card">
      <label>Username</label>
      <input id="user" type="text">

      <label>Password</label>
      <input id="pass" type="password">

      <button onclick="login()">Log In</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <!-- HOME -->
  <div id="home-screen" class="screen hidden">

    <header class="top">
      <span class="logo">GODMODE++</span>
      <button onclick="toggleGalaxy()">Galaxy Mode</button>
    </header>

    <h2>Modes</h2>

    <div class="grid">

      <div class="mode">
        <h3>Free Mode</h3>
        <p>Basic rundown tools.</p>
        <button>Enter</button>
      </div>

      <div class="mode locked">
        <h3>God Mode</h3>
        <p>Premium predictions.</p>
        <button onclick="upgrade()">Unlock</button>
      </div>

      <div class="mode locked">
        <h3>Universe Mode</h3>
        <p>Advanced analytics.</p>
        <button onclick="upgrade()">Unlock</button>
      </div>

      <div class="mode">
        <h3>Director Mode</h3>
        <p>Protected access.</p>
        <button onclick="openDirector()">Enter Passcode</button>
        <p id="director-status" class="status"></p>
      </div>

    </div>
  </div>

  <!-- DIRECTOR PASSCODE -->
  <div id="director-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Director Mode</h2>
      <input id="director-code" type="password" placeholder="Passcode">
      <button onclick="unlockDirector()">Unlock</button>
      <p id="director-error" class="error"></p>
      <button class="close" onclick="closeDirector()">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
<body class="galaxy">
<script src="app.js"></script>
