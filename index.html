<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GODMODE++ Director Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05060a;
      color: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 12px;
    }
    .section {
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      background: #0b0d14;
    }
    .section h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      background: #e53935;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    button:active {
      transform: scale(0.98);
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #080a10;
      color: #f5f5f5;
      font-size: 13px;
    }
    textarea {
      min-height: 60px;
    }
    .output {
      margin-top: 8px;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #11141c;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>GODMODE++ Director Mode</h1>

  <!-- LOGIN -->
  <div class="section">
    <h2>Login</h2>
    <input id="login-email" type="email" placeholder="Email (test@test.com)" />
    <input id="login-password" type="password" placeholder="Password (1234)" />
    <button onclick="handleLogin()">Login</button>
    <div id="login-output" class="output"></div>
  </div>

  <!-- PREDICT -->
  <div class="section">
    <h2>Predict</h2>
    <input id="predict-state" type="text" placeholder="State (e.g. NJ)" />
    <select id="predict-game">
      <option value="P3">Pick 3 (P3)</option>
      <option value="P4">Pick 4 (P4)</option>
    </select>
    <button onclick="handlePredict()">Run Predict</button>
    <div id="predict-output" class="output"></div>
  </div>

  <!-- RUNDOWN -->
  <div class="section">
    <h2>Rundown</h2>
    <input id="rundown-state" type="text" placeholder="State (e.g. NJ)" />
    <button onclick="handleRundown()">Run Rundown</button>
    <div id="rundown-output" class="output"></div>
  </div>

  <!-- ANALYZE (CORNER ENGINE) -->
  <div class="section">
    <h2>Analyze (Corner Engine)</h2>
    <input id="analyze-draw-id" type="text" placeholder="Draw ID (e.g. 2024-06-28-NJ-P3)" />
    <textarea id="analyze-grid" placeholder="Rundown grid rows, comma-separated digits per row (e.g. 1 2 3,4 5 6,7 8 9)"></textarea>
    <input id="analyze-p3-day" type="text" placeholder="Pick3 Day (optional)" />
    <input id="analyze-p3-night" type="text" placeholder="Pick3 Night (optional)" />
    <input id="analyze-p4" type="text" placeholder="Pick4 (optional)" />
    <button onclick="handleAnalyze()">Run Analyze</button>
    <div id="analyze-output" class="output"></div>
  </div>

  <!-- DIRECTOR MODE 3175 -->
  <div class="section">
    <h2>Director Mode 3175</h2>
    <textarea id="director-history" placeholder="History draws, one per line (e.g. 317, 593, 804)"></textarea>
    <button onclick="handleDirector3175()">Run Director 3175</button>
    <div id="director-output" class="output"></div>
  </div>

  <script>
    const BACKEND_URL = "https://godmode-backend.onrender.com"; // your backend

    async function safeFetch(url, options = {}) {
      try {
        const res = await fetch(url, options);
        return await res.json();
      } catch (err) {
        return { error: String(err) };
      }
    }

    // LOGIN
    async function handleLogin() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();
      const out = document.getElementById("login-output");

      const data = await safeFetch(`${BACKEND_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      out.textContent = JSON.stringify(data, null, 2);
    }

    // PREDICT
    async function handlePredict() {
      const state = document.getElementById("predict-state").value.trim() || "NJ";
      const game = document.getElementById("predict-game").value;
      const out = document.getElementById("predict-output");

      const data = await safeFetch(`${BACKEND_URL}/predict?state=${state}&game=${game}`);
      out.textContent = JSON.stringify(data, null, 2);
    }

    // RUNDOWN
    async function handleRundown() {
      const state = document.getElementById("rundown-state").value.trim() || "NJ";
      const out = document.getElementById("rundown-output");

      const data = await safeFetch(`${BACKEND_URL}/rundown?state=${state}`);
      out.textContent = JSON.stringify(data, null, 2);
    }

    // ANALYZE
    async function handleAnalyze() {
      const drawId = document.getElementById("analyze-draw-id").value.trim();
      const gridRaw = document.getElementById("analyze-grid").value.trim();
      const p3Day = document.getElementById("analyze-p3-day").value.trim() || null;
      const p3Night = document.getElementById("analyze-p3-night").value.trim() || null;
      const p4 = document.getElementById("analyze-p4").value.trim() || null;
      const out = document.getElementById("analyze-output");

      const rows = gridRaw
        .split(/\n|;/)
        .map(r => r.trim())
        .filter(r => r.length > 0)
        .map(r =>
          r.replace(/,/g, " ")
           .split(/\s+/)
           .filter(x => x.length > 0)
        );

      const payload = {
        draw_id: drawId,
        rundown_grid: rows,
        pick3_day: p3Day,
        pick3_night: p3Night,
        pick4: p4,
        base_score: 0.5,
        alpha: 0.8
      };

      const data = await safeFetch(`${BACKEND_URL}/analyze`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      out.textContent = JSON.stringify(data, null, 2);
    }

    // DIRECTOR MODE 3175
    async function handleDirector3175() {
      const historyRaw = document.getElementById("director-history").value.trim();
      const out = document.getElementById("director-output");

      const history = historyRaw
        .split(/\n|,/)
        .map(h => h.trim())
        .filter(h => h.length > 0);

      const payload = { history };

      const data = await safeFetch(`${BACKEND_URL}/director/3175`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      out.textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
